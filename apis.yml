name: Calxeda
description: 'Calxeda was an Austin, Texas semiconductor startup — founded in 2008 as Smooth-Stone
  by Barry Evans, Larry Wikelius and David Borland — that built ARM-based EnergyCore system-on-chip
  server processors (ECX-1000, ECX-2000/Midway) aimed at low-power, high-density data center
  workloads. It raised roughly $90-103M from venture investors including Battery Ventures, and its
  silicon shipped in Boston Limited Viridis appliances and HP Project Moonshot systems. Calxeda ceased
  operations in December 2013 after a refinancing round fell through, and its ARM server IP resurfaced
  under Silver Lining Systems in December 2014. The company published no public API, developer portal,
  or machine-readable API artifacts, and calxeda.com is now a parked domain listed for sale, so there
  is no live API surface for the API Evangelist network to catalog.'
